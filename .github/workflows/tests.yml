name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  # Blender releases are the thing most likely to break the add-on, and they
  # arrive on their own schedule, so also check once a week.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  knowledge:
    # bcga_onto is plain Python over the standard library, so it is checked
    # across versions and both with and without the optional rdflib.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        rdflib: [without, with]
    name: knowledge ${{ matrix.python }} ${{ matrix.rdflib }} rdflib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install rdflib
        if: matrix.rdflib == 'with'
        run: python -m pip install rdflib

      - name: Run the knowledge layer tests
        run: python tests/test_onto.py

  blender:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the bpy wheel pins the Python version it was built against
          - bpy: "4.2.0"
            python: "3.11"
    name: Blender ${{ matrix.bpy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install bpy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bpy==${{ matrix.bpy }}"

      - name: Run the add-on tests
        run: python tests/test_bcga.py

      - name: Run the knowledge layer tests
        run: python tests/test_onto.py
